data:
  type: "digits" # MNIST
  n_samples: 100 # Keep small for quick test, increase for real benchmark
  
model:
  type: "quantum_kernel"
  wires: 6         # Increase wires for better resolution
  layers: 4        # Depth
  dev_name: "default.qubit" # Fallback: use "lightning.gpu" if installed
  # dev_name: "lightning.gpu" # PennyLane CUDA backend (requires cuQuantum)

optimization:
  optimize_kernel: true
  steps: 10
  learning_rate: 0.1

training:
  type: "svc"
